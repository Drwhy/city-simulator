services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - citysim-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  citysim-data:
